# Starts Build Package for com.riry.ftemulator in Rionquosue/rirytools_vpm on every push to
# main (stable) or beta (beta) that changes com.riry.ftemulator/. RiryTools has its own,
# notify-vpm.yml, so a push that changes only one package builds only that one.
#
# VPM_DISPATCH_TOKEN is a fine-grained token for Rionquosue/rirytools_vpm only, with
# only Actions: Read and write: it can start workflows there and nothing else.
name: Notify VPM (FTEmulator)

on:
  push:
    branches:
      - main
      - beta
    paths:
      - com.riry.ftemulator/**

permissions:
  contents: read

# One push at a time per branch, so Build Package is started in push order.
concurrency:
  group: notify-vpm-ftemulator-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notify:
    # Runs only in the main repository, never in forks such as riryunityworkflow_dev.
    if: github.repository == 'Rionquosue/riryunityworkflow'
    runs-on: ubuntu-latest
    steps:
      - name: Start Build Package for FTEmulator in rirytools_vpm
        env:
          GH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
          CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'beta' }}
          SHA: ${{ github.sha }}
        run: gh workflow run build-package.yml --repo Rionquosue/rirytools_vpm --ref main -f package=com.riry.ftemulator -f channel="$CHANNEL" -f sha="$SHA"
