# Starts Build Package in Rionquosue/rirytools_vpm whenever main changes. Nothing
# is sent but the request: that workflow reads this repository's main itself.
#
# Secret VPM_DISPATCH_TOKEN (Settings > Secrets and variables > Actions): a
# fine-grained token for Rionquosue/rirytools_vpm only, with Actions: Read and write.
name: Notify VPM repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    # Runs only in the main repository, not in forks such as the _dev staging copy.
    if: github.repository == 'Rionquosue/riryunityworkflow'
    runs-on: ubuntu-latest
    steps:
      - name: Start Build Package
        env:
          GH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
          VPM_REPOSITORY: Rionquosue/rirytools_vpm
        run: gh workflow run build-package.yml --repo "$VPM_REPOSITORY" --ref main
