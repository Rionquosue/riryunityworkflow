# Starts Build Package in the VPM repository whenever main changes. Nothing is
# sent but the request: that workflow reads this repository's main itself.
#
# Settings > Secrets and variables > Actions:
#   Secret VPM_DISPATCH_TOKEN: a fine-grained token for the VPM repository only,
#   with Actions: Read and write.
#   Variable VPM_REPOSITORY (optional): owner/name of the VPM repository, if it is
#   not <owner>/rirytools_vpm.
name: Notify VPM repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Start Build Package
        env:
          GH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
          VPM_REPOSITORY: ${{ vars.VPM_REPOSITORY || format('{0}/rirytools_vpm', github.repository_owner) }}
        run: gh workflow run build-package.yml --repo "$VPM_REPOSITORY" --ref main
