# Asks the VPM repository to build a package from this commit whenever main
# changes. Only the commit is sent; the VPM repository checks out the code itself.
#
# Repository settings (Settings > Secrets and variables > Actions):
#   Variable VPM_REPOSITORY      owner/name of the VPM repository. Unset: does nothing.
#   Secret   VPM_DISPATCH_TOKEN  Token allowed to dispatch to it (Contents: read and write).
name: Notify VPM repository

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    if: vars.VPM_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request a VPM build
        env:
          GH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
        run: |
          gh api "repos/${{ vars.VPM_REPOSITORY }}/dispatches" \
            -f event_type=source-updated \
            -f "client_payload[sha]=${{ github.sha }}"
