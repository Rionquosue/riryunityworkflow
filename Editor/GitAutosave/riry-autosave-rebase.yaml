# Keeps Riry autosave branches based on the latest base branch.
# Installed by Tools > Rirytools > Git Autosave > Install Rebase Workflow.
# Each autosave commit is replayed onto the base branch; when both changed a
# file, the autosave version wins, so a backup is never lost to a conflict.
name: Rebase autosave branches

on:
  push:
    branches:
      - main
      - 'autosave/**'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: riry-autosave-rebase
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE_BRANCH: main
  AUTOSAVE_BRANCHES: 'autosave/**'

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Replay autosave commits onto the base branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet --prune origin \
            "+refs/heads/*:refs/remotes/origin/*"
          base=$(git rev-parse --verify "refs/remotes/origin/$BASE_BRANCH")
          zero=$(git hash-object -t blob /dev/null | tr '0-9a-f' '0')
          export GIT_INDEX_FILE="$RUNNER_TEMP/autosave-index"
          status=0
          for ref in $(git for-each-ref --format='%(refname)' \
              "refs/remotes/origin/${AUTOSAVE_BRANCHES%%\**}"); do
            branch=${ref#refs/remotes/origin/}
            case "$branch" in $AUTOSAVE_BRANCHES) ;; *) continue ;; esac
            [ "$branch" = "$BASE_BRANCH" ] && continue
            tip=$(git rev-parse "$ref")
            if ! fork=$(git merge-base "$base" "$tip"); then
              echo "::warning::$branch shares no history with $BASE_BRANCH; skipped."
              continue
            fi
            if [ "$fork" = "$base" ]; then
              echo "$branch is already based on $BASE_BRANCH."
              continue
            fi
            new=$base
            for commit in $(git rev-list --reverse --first-parent "$fork..$tip"); do
              git read-tree "$new"
              git diff-tree -r -z --no-renames --no-commit-id "$commit^" "$commit" |
                while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
                  set -- $meta
                  if [ "$5" = D ]; then
                    printf '0 %s\t%s\0' "$zero" "$path"
                  else
                    printf '%s %s\t%s\0' "$2" "$4" "$path"
                  fi
                done | git update-index -z --index-info
              tree=$(git write-tree)
              [ "$tree" = "$(git rev-parse "$new^{tree}")" ] && continue
              new=$(GIT_AUTHOR_NAME=$(git log -1 --format=%an "$commit") \
                GIT_AUTHOR_EMAIL=$(git log -1 --format=%ae "$commit") \
                GIT_AUTHOR_DATE=$(git log -1 --format=%aI "$commit") \
                git commit-tree "$tree" -p "$new" -m "$(git log -1 --format=%B "$commit")")
            done
            if git push --quiet --force-with-lease="refs/heads/$branch:$tip" \
                origin "$new:refs/heads/$branch"; then
              echo "Rebased $branch onto $BASE_BRANCH."
            else
              echo "::warning::$branch changed during the rebase; the next run retries."
              status=1
            fi
          done
          exit $status
