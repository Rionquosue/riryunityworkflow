# Avatar Migration Assistant component types.
#
# Copied to Documents/RiryTools/migrator/types.yml when that file is missing; the copy is the
# list the tool reads, so edit that one. Every type from Pumkin's Avatar Tools is here, sorted
# by what kind of type it is.
#
# Each category holds entries; each entry is one checkbox in the Copy list:
#   id:       a unique name the settings remember it by
#   label:    the name shown
#   common:   true to show it in the Common list (every entry shows in All)
#   enabled:  true to start ticked
#   sdk:      true when it needs the VRChat SDK
#   rule:     a built-in rule the tool applies to this entry; leave it as it is
#   types:    full type names, or Namespace.* for every component in a namespace
#
# A run copies the built-in entries in a fixed order (colliders before the bones that use
# them); other entries are copied after them, in the order of this file.

